version: 2

project_name: prompter

builds:
  - &macos_build
    id: macos
    binary: prompter
    goos: [darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    tags:
      - sqlite
    ldflags:
      - -s -w
      # Build-time version stamps (UTC). In CI with a pipeline ID available
      # (e.g. GITHUB_RUN_ID) the build identifier is ci.{pipeline-id}.{timestamp},
      # otherwise it falls back to the local lb.{timestamp} form.
      - -X github.com/hkionline/prompter/internal/version.BuildDate={{ .Now.Format "2006-01-02T15:04:05Z07:00" }}
      - -X github.com/hkionline/prompter/internal/version.BuildID={{ if isEnvSet "GITHUB_RUN_ID" }}ci.{{ envOrDefault "GITHUB_RUN_ID" "" }}.{{ .Now.Format "20060102150405" }}{{ else }}lb.{{ .Now.Format "20060102150405" }}{{ end }}
  - <<: *macos_build
    id: portable
    goos: [linux, windows]
    goarch: [386, amd64, arm64]

archives:
  - id: macos
    ids: [macos]
    formats: [tar.gz]
  - id: portable
    ids: [portable]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  name_template: 'Prompter {{ .Tag }}'
  prerelease: auto

snapshot:
  version_template: '{{ envOrDefault "PROMPTER_VERSION" .Version }}-SNAPSHOT-{{ .ShortCommit }}'

homebrew_casks:
  - name: prompter
    ids: [macos]
    binaries:
      - prompter
    description: 'MCP-server for storing and calling your custom prompts.'
    homepage: 'https://github.com/hkionline/prompter'
    caveats: |
      Run prompter --version to verify installation.
      Configure your MCP client with the absolute path shown by command -v prompter.
      SQLite is included; filesystem storage remains the default.
    hooks:
      post:
        install: |
          on_macos do
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/prompter"]
          end
    skip_upload: auto
    repository:
      owner: hkionline
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'

# Enable the size reporting of binaries
report_sizes: true
